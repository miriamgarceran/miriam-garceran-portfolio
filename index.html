<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miriam Garcerán — Comunicación, creatividad y eventos</title>
    <meta
      name="description"
      content="Portfolio de Miriam Garcerán. Dirección creativa, comunicación, RRPP y producción de eventos. Murcia, abierta a remoto."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=91" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="index.html">MG</a>
      <nav class="nav" aria-label="Principal">
        <a href="index.html#work" data-i18n="nav.work" aria-current="page">Work</a>
        <a href="about.html" data-i18n="nav.about">About me</a>
        <a href="contact.html" data-i18n="nav.contact">Contact</a>
        <div class="lang" role="group" aria-label="Idioma">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </nav>
    </header>

    <main id="top">
      <section class="hero hero--video">
        <div class="hero-video-wrap">
          <video
            class="hero-video"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            id="hero-vid"
          >
            <source src="assets/hero.mp4" type="video/mp4" />
          </video>
          <button class="hero-audio-btn" id="hero-audio-btn" aria-label="Activar sonido">
            <svg class="hero-audio-icon hero-audio-icon--off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <line x1="23" y1="9" x2="17" y2="15"/>
              <line x1="17" y1="9" x2="23" y2="15"/>
            </svg>
            <svg class="hero-audio-icon hero-audio-icon--on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            <span class="hero-audio-label">Activar sonido</span>
          </button>
        </div>
      </section>

      <section id="work">
        <div class="section-head">
          <h2 data-i18n="work.title">Work</h2>
        </div>
        <div class="work-list" id="work-list"></div>
      </section>

    </main>

    <footer class="site-footer">
      <span>Miriam Garcerán</span>
      <span id="year"></span>
    </footer>

    <svg class="ripple-defs" aria-hidden="true" focusable="false">
      <defs>
        <filter
          id="water-ripple"
          x="-25%"
          y="-25%"
          width="150%"
          height="150%"
          color-interpolation-filters="sRGB"
        >
          <feTurbulence
            id="water-turb"
            type="fractalNoise"
            baseFrequency="0.008 0.018"
            numOctaves="2"
            seed="3"
            result="waves"
          />
          <feDisplacementMap
            id="water-disp"
            in="SourceGraphic"
            in2="waves"
            scale="56"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <script src="js/content.js?v=86"></script>
    <script src="js/coverflow.js?v=82"></script>
    <script src="js/marquee.js?v=82"></script>
    <script src="js/main.js?v=82"></script>
    <script src="js/cursor.js?v=83"></script>
    <script>
      (function () {
        var vid = document.getElementById("hero-vid");
        var btn = document.getElementById("hero-audio-btn");
        var iconOff = btn.querySelector(".hero-audio-icon--off");
        var iconOn  = btn.querySelector(".hero-audio-icon--on");
        var label   = btn.querySelector(".hero-audio-label");

        btn.addEventListener("click", function () {
          vid.muted = !vid.muted;
          if (!vid.muted) {
            iconOff.style.display = "none";
            iconOn.style.display  = "block";
            label.textContent     = "Silenciar";
          } else {
            iconOff.style.display = "block";
            iconOn.style.display  = "none";
            label.textContent     = "Activar sonido";
          }
        });
      })();
    </script>
  </body>
</html>
