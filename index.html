<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miriam Garcerán — Comunicación, creatividad y eventos</title>
    <meta
      name="description"
      content="Portfolio de Miriam Garcerán. Dirección creativa, comunicación, RRPP y producción de eventos. Murcia, abierta a remoto."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=69" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="index.html">MG</a>
      <nav class="nav" aria-label="Principal">
        <a href="index.html#work" data-i18n="nav.work" aria-current="page">Work</a>
        <a href="#contact">Contact</a>
        <div class="lang" role="group" aria-label="Idioma">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </nav>
    </header>

    <main id="top">
      <section class="hero">
        <div class="hero-copy">
          <h1>Miriam Garcerán</h1>
          <p class="hero-sub" data-i18n="hero.sub">
            comunicación · creatividad · eventos
          </p>
          <p class="hero-meta" data-i18n="hero.meta">
            Región de Murcia · abierta a remoto y a ofertas en España
          </p>
          <a class="page-link" href="about.html" data-i18n="aboutCta">About me</a>
        </div>
      </section>

      <section id="work">
        <div class="section-head">
          <h2 data-i18n="work.title">Work</h2>
        </div>
        <div class="work-list" id="work-list"></div>
      </section>

      <section class="contact" id="contact">
        <h2>Contact</h2>
        <div class="contact-links">
          <a href="mailto:miriamgarceran@estudiotreintayocho.com"
            >miriamgarceran@estudiotreintayocho.com</a
          >
          <a href="mailto:miriamgarceran@gmail.com">miriamgarceran@gmail.com</a>
          <a
            href="https://www.linkedin.com/in/miriam-garcer%C3%A1n-pulido-7a801b141"
            target="_blank"
            rel="noreferrer"
            >LinkedIn</a
          >
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>Miriam Garcerán</span>
      <span id="year"></span>
    </footer>

    <svg class="ripple-defs" aria-hidden="true" focusable="false">
      <defs>
        <filter
          id="water-ripple"
          x="-25%"
          y="-25%"
          width="150%"
          height="150%"
          color-interpolation-filters="sRGB"
        >
          <feTurbulence
            id="water-turb"
            type="fractalNoise"
            baseFrequency="0.008 0.018"
            numOctaves="2"
            seed="3"
            result="waves"
          />
          <feDisplacementMap
            id="water-disp"
            in="SourceGraphic"
            in2="waves"
            scale="56"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <script src="js/content.js?v=69"></script>
    <script src="js/coverflow.js?v=69"></script>
    <script src="js/marquee.js?v=69"></script>
    <script src="js/main.js?v=69"></script>
    <script src="js/cursor.js?v=69"></script>
  </body>
</html>
