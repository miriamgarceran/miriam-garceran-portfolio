<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>About me — Miriam Garcerán</title>
    <meta
      name="description"
      content="About me de Miriam Garcerán. Dirección creativa, comunicación, RRPP y producción de eventos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=91" />
    <style>
      @media (max-width: 860px), (pointer: coarse) and (max-width: 1200px) {
        .about-top {
          position: relative;
          align-items: flex-end;
          padding-bottom: clamp(72px, 22vw, 108px);
        }
        .about-hero {
          margin: 0;
          min-height: clamp(110px, 18vh, 180px);
        }
        .about-columns-wrap {
          display: block;
          position: relative;
          max-width: none;
          padding: 0 var(--gutter) clamp(24px, 5vw, 40px);
        }
        .about-col-photo--left-mid {
          position: absolute;
          top: 0;
          right: 0;
          left: auto;
          width: 72px;
          margin: 0;
          transform: translate(6px, calc(-100% - 12px)) rotate(6deg);
          transform-origin: top right;
          z-index: 5;
          filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5));
          pointer-events: none;
        }
        .about-col-photo--left-mid img {
          width: 100%;
          height: auto;
          display: block;
        }
        .about-body {
          margin-top: 4px;
          width: 100%;
          column-count: 2;
          column-gap: 14px;
        }
        .about-section,
        .about-section--intro,
        .about-columns {
          display: block;
          column-count: 1;
        }
        .about-section {
          break-inside: avoid;
          padding: 0.85rem 0 0.95rem;
        }
        .about-section h3 {
          margin: 0 0 0.45rem;
          font-size: 12px;
        }
        .about-columns p,
        .about-section:not(.about-section--intro) p,
        .about-copy p {
          max-width: none;
          font-size: 13px;
          line-height: 1.5;
          margin-bottom: 0.85em;
        }
        .about-doodles {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="index.html">MG</a>
      <nav class="nav" aria-label="Principal">
        <a href="index.html#work" data-i18n="nav.work">Work</a>
        <a href="about.html" aria-current="page" data-i18n="nav.about">About me</a>
        <a href="contact.html" data-i18n="nav.contact">Contact</a>
        <div class="lang" role="group" aria-label="Idioma">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </nav>
    </header>

    <main>
      <section id="about" class="about-page">
        <div class="about-top">
          <div class="about-hero">
            <h1 class="about-title" data-i18n="about.title">about me</h1>
            <img
              class="about-mascot"
              src="assets/img/lucifer-transparent.png"
              alt=""
              aria-hidden="true"
            />
          </div>
          <figure class="about-col-photo--right-top">
            <img src="assets/img/contact.jpg" alt="Miriam Garcerán" />
          </figure>
        </div>
        <div class="about-columns-wrap">
          <figure class="about-col-photo--left-mid">
            <img src="assets/img/contact2.jpg" alt="Miriam Garcerán" />
          </figure>
          <div class="about-body" id="about-body"></div>
        </div>
        <p class="about-back">
          <a class="page-link" href="index.html#work" data-i18n="backToWork"
            >Volver a Work</a
          >
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Miriam Garcerán</span>
      <span id="year"></span>
    </footer>

    <svg class="ripple-defs" aria-hidden="true" focusable="false">
      <defs>
        <filter
          id="water-ripple"
          x="-25%"
          y="-25%"
          width="150%"
          height="150%"
          color-interpolation-filters="sRGB"
        >
          <feTurbulence
            id="water-turb"
            type="fractalNoise"
            baseFrequency="0.008 0.018"
            numOctaves="2"
            seed="3"
            result="waves"
          />
          <feDisplacementMap
            id="water-disp"
            in="SourceGraphic"
            in2="waves"
            scale="56"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <script src="js/content.js?v=83"></script>
    <script src="js/main.js?v=83"></script>
    <script src="js/cursor.js?v=83"></script>
  </body>
</html>
