<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Miriam Garcerán</title>
    <meta
      name="description"
      content="Contacta con Miriam Garcerán. Dirección creativa, comunicación, RRPP y producción de eventos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=87" />
    <style>
      /* ── Contact page ── */
      .contact-page {
        min-height: 100vh;
        padding: clamp(80px, 10vh, 120px) var(--gutter) clamp(48px, 8vh, 96px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 640px;
        position: relative;
        overflow: visible;
      }

      .contact-page__info {
        z-index: 2;
        position: relative;
      }

      .contact-page__label {
        font-family: var(--font);
        font-size: clamp(11px, 1vw, 13px);
        letter-spacing: 0.14em;
        line-height: 2;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 clamp(24px, 3vw, 40px);
      }

      .contact-page__name {
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(42px, 9.2vw, 128px);
        line-height: 0.95;
        letter-spacing: -0.045em;
        text-transform: uppercase;
        margin: 0 0 clamp(28px, 4vw, 56px);
        color: var(--text);
      }

      .contact-page__items {
        display: flex;
        flex-direction: column;
        gap: clamp(18px, 2.2vw, 28px);
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .contact-page__item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .contact-page__item-label {
        font-family: var(--font);
        font-size: clamp(9px, 0.8vw, 11px);
        letter-spacing: 0.12em;
        line-height: 1.8;
        text-transform: uppercase;
        color: var(--muted);
      }

      .contact-page__item-value {
        font-family: var(--font);
        font-size: clamp(15px, 1.8vw, 22px);
        letter-spacing: 0;
        line-height: 1.5;
        color: var(--text);
        text-decoration: none;
        border-bottom: 1.5px solid transparent;
        transition: border-color 0.2s ease, opacity 0.2s ease;
        display: inline-block;
        padding-bottom: 1px;
      }

      a.contact-page__item-value:hover {
        border-color: currentColor;
        opacity: 0.75;
      }

      /* ── Photo stack ── */
      .contact-page__photo-wrap {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-end;
        padding-right: 0;
      }

      /* Stack wrapper */
      .contact-page__stack {
        position: relative;
        width: clamp(240px, 38vw, 480px);
      }

      /* Chincheta eliminada */

      /* First photo — landscape, no extra frame (the JPG is already a polaroid-style shot) */
      .contact-page__photo-1 {
        position: relative;
        z-index: 4;
        transform: rotate(-10deg);
        transform-origin: center bottom;
        filter: drop-shadow(0 16px 40px rgba(0,0,0,0.7));
        width: 100%;
      }

      .contact-page__photo-1 img {
        display: block;
        width: 100%;
        height: auto;
      }

      /* Second photo — portrait Polaroid (the image itself has the white border) */
      .contact-page__photo-2 {
        position: relative;
        z-index: 3;
        transform: rotate(7deg);
        transform-origin: center top;
        filter: drop-shadow(0 12px 32px rgba(0,0,0,0.6));
        width: 55%;
        margin: -60px auto 0;
      }

      .contact-page__photo-2 img {
        display: block;
        width: 100%;
        height: auto;
      }

      /* ── Footer nav ── */
      .contact-page__footer-nav {
        display: flex;
        gap: clamp(24px, 4vw, 48px);
        justify-content: center;
        padding: clamp(48px, 8vh, 96px) var(--gutter) clamp(32px, 5vh, 64px);
        border-top: 1px solid var(--line);
      }

      .contact-page__footer-nav a {
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(13px, 1.4vw, 18px);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text);
        text-decoration: none;
        opacity: 0.6;
        transition: opacity 0.2s;
      }

      .contact-page__footer-nav a:hover {
        opacity: 1;
      }

      /* ── Back link ── */
      .contact-back {
        position: fixed;
        top: clamp(14px, 2vh, 24px);
        left: calc(var(--gutter) + 42px);
        z-index: 100;
        font-family: var(--font);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text);
        text-decoration: none;
        opacity: 0.6;
        transition: opacity 0.2s;
      }

      .contact-back:hover {
        opacity: 1;
      }

      /* ── Mobile ── */
      @media (max-width: 720px) {
        .contact-page {
          grid-template-columns: 1fr;
          padding-top: clamp(80px, 12vh, 120px);
        }

        .contact-page__photo-wrap {
          order: -1;
          align-items: center;
        }

        .contact-page__stack {
          right: 0;
          width: clamp(220px, 72vw, 360px);
        }
      }
    </style>
  </head>
  <body>
    <a class="contact-back" href="index.html">work →</a>

    <header class="site-header">
      <a class="wordmark" href="index.html">MG</a>
      <nav class="nav" aria-label="Principal">
        <a href="index.html#work" data-i18n="nav.work">Work</a>
        <a href="about.html" data-i18n="nav.about">About me</a>
        <a href="contact.html" aria-current="page" data-i18n="nav.contact">Contact</a>
        <div class="lang" role="group" aria-label="Idioma">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </nav>
    </header>

    <main>
      <section class="contact-page" aria-label="Datos de contacto">

        <!-- LEFT: info -->
        <div class="contact-page__info">
          <p class="contact-page__label" data-i18n="contact.label">Dirección creativa · eventos · comunicación</p>

          <h1 class="contact-page__name">Miriam<br>Garcerán<br>Pulido</h1>

          <ul class="contact-page__items">
            <li class="contact-page__item">
              <span class="contact-page__item-label" data-i18n="contact.phone">Teléfono</span>
              <a class="contact-page__item-value" href="tel:+34640078859">640 078 859</a>
            </li>
            <li class="contact-page__item">
              <span class="contact-page__item-label" data-i18n="contact.email">Email</span>
              <a class="contact-page__item-value" href="mailto:miriamgarceran@estudiotreintayocho.com">miriamgarceran@estudiotreintayocho.com</a>
            </li>
            <li class="contact-page__item">
              <a class="contact-page__item-value" href="mailto:miriamgarceran@gmail.com">miriamgarceran@gmail.com</a>
            </li>
            <li class="contact-page__item">
              <span class="contact-page__item-label">LinkedIn</span>
              <a class="contact-page__item-value"
                href="https://www.linkedin.com/in/miriam-garcer%C3%A1n-pulido-7a801b141"
                target="_blank"
                rel="noopener noreferrer">miriam-garcerán-pulido</a>
            </li>
          </ul>
        </div>

        <!-- Fotos trasladadas a about.html -->

      </section>

      <nav class="contact-page__footer-nav" aria-label="Navegar a">
        <a href="index.html#work" data-i18n="nav.work">Work</a>
        <a href="about.html" data-i18n="nav.about">About me</a>
      </nav>

    </main>

    <footer class="site-footer">
      <span>Miriam Garcerán</span>
      <span id="year"></span>
    </footer>

    <svg class="ripple-defs" aria-hidden="true" focusable="false">
      <defs>
        <filter
          id="water-ripple"
          x="-25%"
          y="-25%"
          width="150%"
          height="150%"
          color-interpolation-filters="sRGB"
        >
          <feTurbulence
            id="water-turb"
            type="fractalNoise"
            baseFrequency="0.008 0.018"
            numOctaves="2"
            seed="3"
            result="waves"
          />
          <feDisplacementMap
            id="water-disp"
            in="SourceGraphic"
            in2="waves"
            scale="56"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <script src="js/content.js?v=83"></script>
    <script src="js/main.js?v=83"></script>
    <script src="js/cursor.js?v=83"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
